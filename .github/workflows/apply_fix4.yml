{"name":"Apply Fix 4","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"deps","run":"pip install -q -r requirements.txt"},{"name":"apply","run":"cat .fix4/p*.txt | tr -d '\\n' > /tmp/fix4.b64\nbase64 -d /tmp/fix4.b64 | gunzip > /tmp/fix4.patch\necho \"90097009fe935518fd15c842ef4014b31065bb1b0f7f7c2dd6370d380927257e  /tmp/fix4.patch\" | sha256sum -c -\ngit apply --check /tmp/fix4.patch\ngit apply /tmp/fix4.patch\npython3 -m py_compile scanner/prices.py self_test.py intraday_summary_mail.py intraday_high_alert.py\npython3 - <<'PY'\nimport sys; sys.path.insert(0,'.')\nimport self_test as t\nt._test_intraday_summary_counts_today_only()\nt._test_prefetch_pause_is_carried_over()\nt._test_every_workflow_notifies_on_failure()\nPY\nrm -rf .fix4\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"fix(intraday): count only today in daily summary and carry prefetch pause between scans\"\ngit push"},{"name":"failure mail (if: failure())","if":"failure()","env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 notify_workflow_failure.py"}]}}}
