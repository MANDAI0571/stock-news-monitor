{"name":"Apply Fix 3","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4"},{"name":"apply","run":"set -euo pipefail\ncat > /tmp/fix.b64 <<'B64'\\nB64\nbase64 -d /tmp/fix.b64 | gunzip > /tmp/fix.patch\ngot=$(sha256sum /tmp/fix.patch | cut -d' ' -f1)\necho \"PATCH_SHA got=$got want=bb60cf4d5c0481732f87762249d62818c23e0a7deef3e12dcaaba6a77514cfcf\"\nif [ \"$got\" != \"bb60cf4d5c0481732f87762249d62818c23e0a7deef3e12dcaaba6a77514cfcf\" ]; then echo \"PATCH_CORRUPT\"; exit 1; fi\ngit apply --check -v /tmp/fix.patch\ngit apply /tmp/fix.patch\npython -m py_compile scanner/prices.py self_test.py\necho \"PY_COMPILE_OK\"\ngit --no-pager diff --stat\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add scanner/prices.py self_test.py\ngit commit -m \"fix(prices): slow down prefetch automatically when Yahoo rate-limits\"\ngit push\ngit --no-pager log --oneline -1\necho \"APPLY_FIX_DONE\"\n"},{"name":"Notify failure by mail","if":"failure()","env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 notify_workflow_failure.py\n"}]}}}
