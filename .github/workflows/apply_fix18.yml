{"name":"apply_fix18","on":{"workflow_dispatch":{}},"jobs":{"apply":{"runs-on":"ubuntu-latest","permissions":{"contents":"write","actions":"read"},"steps":[{"uses":"actions/checkout@v7"},{"uses":"actions/setup-python@v6","with":{"python-version":"3.11"}},{"name":"deps","run":"pip install -r requirements.txt"},{"name":"patch","run":"cat tools/fix18.b64 | base64 -d | gunzip > tools/p18.py && python3 tools/p18.py && rm -f tools/p18.py && git rm -q tools/fix18.b64"},{"name":"selftest","run":"python3 self_test.py"},{"name":"push","run":"git config user.name github-actions && git config user.email actions@github.com && git add -A && git commit -m 'fix18: per-article plain-text copy mails for iPhone' && git push"},{"name":"fetch","env":{"GH_TOKEN":"${{ github.token }}"},"run":"rm -rf outputs && mkdir -p outputs && a=$(gh run list --workflow daily-discipline.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId') && gh run download \"$a\" -n stock-news-monitor-outputs -D outputs || true; b=$(gh run list --workflow note_draft_cloud.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId') && gh run download \"$b\" -n note-draft-cloud -D outputs || true; ls outputs | head -50"},{"name":"send","env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 cloud_mail_digest.py --output-dir outputs --force-send"},{"name":"notify",if: failure(),"env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 notify_workflow_failure.py"}]}}}
