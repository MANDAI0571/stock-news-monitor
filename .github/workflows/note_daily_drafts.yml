name: Note Daily Drafts

# note の2本立て（2026-10-16 持ち主の指示）。毎営業日の引け後に、
#   (A) 高値更新・押し目・セリングクライマックス ランキング
#   (B) Claudeが300万円運用｜運用状況
# を作り、持ち主に note 貼り付け用のメールで届ける（2026-10-18 から。note は reCAPTCHA で自動ログインできないため）。
# 中身は note_two.py。それまでの4本の note（note_draft_cloud.yml）とそのメールは止めた。
#
# 起こし方: 中継（intraday_relay）が立会日の 16:00 に note_daily を送る（終値は15分遅れで届くため）。cron は予備
#   （数時間遅れて届く）。記事の日はその時刻で決め（引け後ならその日、翌朝なら前の立会日、
#   立会中は作らない）、同じ日を二度保存しないよう、保存できた日を Actions のキャッシュに印として残す。
# push のとき（このファイルを変えたとき）は、作るところまでで保存はしない（動作の確認）。
# 公開リポジトリなので、実行ログには銘柄を出さない（スクリーニングの出力はファイルにだけ残す）。
# 2026-10-18: note のログイン画面が reCAPTCHA を求め、自動ログインできないと分かった（突破はしない）。
#   下書きへの自動保存はやめ、note に貼り付けるだけの形で持ち主にメールで届ける（note_mail.py）。
#   push の確認ではメールを送らない。コミットの文に [note-mail] があるときだけ送る。

on:
  repository_dispatch:
    types: [note_daily]
  schedule:
    - cron: "10 8 * * 1-5"    # 17:10 JST（予備）
    - cron: "10 12 * * 1-5"   # 21:10 JST（予備）
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/note_daily_drafts.yml"

concurrency:
  group: note-daily-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      OUT: outputs/note_two
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide the day
        id: day
        run: |
          python -m pip install jpholiday "pandas>=2.2,<3.0" >/dev/null 2>&1 || true
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import intraday_relay as R
          import note_two as N
          lib = R._jpholiday()
          import os
          now = dt.datetime.now(N.JST)
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              # 動作の確認だけ。立会中でもその日の途中の値で最後まで作る（保存はしない）。
              # 前の立会日にすると、取れる株価（今日）と日付が合わず歯止めで止まった（2026-10-16）。
              now = now.replace(hour=16, minute=0)
          day = N.target_day(now, lambda d: R.is_business_day(d, lib))
          print(f"day={day or ''}")
          print(f"run={'true' if day else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Already saved for this day?
        id: done
        if: steps.day.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: outputs/note_two_done
          key: note-daily-done-${{ steps.day.outputs.day }}
          lookup-only: true

      - name: Install dependencies
        if: steps.day.outputs.run == 'true' && (steps.done.outputs.cache-hit != 'true' || contains(github.event.head_commit.message || '', '[note-mail]'))
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt >/dev/null
          # note の見出し画像の日本語の字体（IPAex ゴシック）。matplotlib は要らないので --no-deps（2026-10-22）
          pip install "pillow>=10,<12" >/dev/null && pip install --no-deps "japanize-matplotlib==1.1.3" >/dev/null || echo "::warning title=note 画像::字体を入れられませんでした（タグだけ送ります）"

      - name: Screening (pullback list)
        # 確認（push）のときは失敗しても失敗メールを出さない（本番の回だけ知らせる）
        continue-on-error: ${{ github.event_name == 'push' }}
        if: steps.day.outputs.run == 'true' && (steps.done.outputs.cache-hit != 'true' || contains(github.event.head_commit.message || '', '[note-mail]'))
        env:
          PRICE_CACHE_REFRESH: "1"
        run: |
          mkdir -p "$OUT"
          python3 run_screening.py --output-dir "$OUT" --include-rejected > "$OUT/screening.log" 2>&1
          tail -3 "$OUT/screening.log" | grep -E "timing|screening_summary" | sed 's/candidates=.*//' || true

      - name: Selling climax (close)
        # 確認（push）のときは失敗しても失敗メールを出さない（本番の回だけ知らせる）
        continue-on-error: ${{ github.event_name == 'push' }}
        if: steps.day.outputs.run == 'true' && (steps.done.outputs.cache-hit != 'true' || contains(github.event.head_commit.message || '', '[note-mail]'))
        run: |
          pip install "openpyxl>=3.1,<4" >/dev/null
          python3 volume_screener/daily_run.py --asof "${{ steps.day.outputs.day }}" > /dev/null 2> "$OUT/climax.log" || true
          tail -2 "$OUT/climax.log" | grep -v "split_adjusted" || true

      - name: Restore liquidity track
        # 高値更新の銘柄の「注文の溜まり」の記録（liquidity_track.py）。前の回までの記録を戻して書き足す（2026-10-25）
        if: steps.day.outputs.run == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: liquidity_track
          key: liquidity-track-none-${{ github.run_id }}
          restore-keys: liquidity-track-

      - name: Build two articles
        id: build
        # 確認（push）のときは失敗しても失敗メールを出さない（本番の回だけ知らせる）
        continue-on-error: ${{ github.event_name == 'push' }}
        if: steps.day.outputs.run == 'true' && (steps.done.outputs.cache-hit != 'true' || contains(github.event.head_commit.message || '', '[note-mail]'))
        env:
          INTRADAY_USE_WATCHLIST: "0"
          IH_MIN_TURNOVER: "50000000"
          PREFETCH_BATCH_SIZE: "200"
          YFINANCE_THREADS: "true"
        run: |
          python3 note_two.py --day "${{ steps.day.outputs.day }}" --out "$OUT" > "$OUT/build.log" 2>&1 || { tail -25 "$OUT/build.log"; exit 1; }
          grep "^note_two" "$OUT/build.log"
          grep -E "^(liquidity_track|ict_track)" "$OUT/build.log" | while read -r l; do echo "::notice title=liquidity track::$l"; done || true
          test -f "$OUT/note_drafts_manifest.json"

      - name: Keep liquidity track
        # 記録は銘柄が入るのでコミットせず、キャッシュに置く。push（確認）の回の記録は残さない
        if: github.event_name != 'push' && steps.build.outcome == 'success' && hashFiles('liquidity_track/records.jsonl') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: liquidity_track
          key: liquidity-track-${{ steps.day.outputs.day }}-${{ github.run_id }}

      - name: Keep sector strength for the next 13:50 screener
        # 全市場の業種の勢い（その日の終値。業種名と数字だけ）を、翌営業日 14:05 の出来高急増の
        # ランク（◎）に渡す（volume_screener/rank.py）。立会中の push の値を渡さないよう、push では残さない。
        if: github.event_name != 'push' && hashFiles('sector_strength/strength.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: sector_strength
          key: sector-strength-${{ steps.day.outputs.day }}

      - name: Mail articles for pasting
        id: save
        # 2026-10-18: note は reCAPTCHA で自動ログインできない（突破はしない）。記事は持ち主に
        # メールで届け、note には貼り付けるだけにする。push の確認では送らない（[note-mail] があれば送る）。
        if: steps.day.outputs.run == 'true' && (steps.done.outputs.cache-hit != 'true' || contains(github.event.head_commit.message || '', '[note-mail]')) && (github.event_name != 'push' || contains(github.event.head_commit.message, '[note-mail]'))
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 note_mail.py --dir "$OUT" --subject "【note貼り付け用】${{ steps.day.outputs.day }} 日本株（ランク記事・Claudeの300万円運用）" > "$OUT/mail.log" 2>&1 || true
          # 2026-10-19: 「成功」なのにメールが届かなかった。結果の行（件名と送ったか）を注記に出す
          line=$(grep -E "note_mail=|Error|error" "$OUT/mail.log" | tail -3 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<mail>/g' | tr '\n' ' ' | cut -c1-300)
          echo "::notice title=note 貼り付け用メール::${line:-（結果の行なし）} files=$(ls "$OUT" | tr '\n' ' ' | cut -c1-200)"
          grep -q "note_mail=sent" "$OUT/mail.log" || exit 1
          mkdir -p outputs/note_two_done && echo "${{ steps.day.outputs.day }}" > outputs/note_two_done/day.txt
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - name: Remember the saved day
        if: steps.save.outputs.saved == 'true'
        uses: actions/cache/save@v4
        with:
          path: outputs/note_two_done
          key: note-daily-done-${{ steps.day.outputs.day }}

      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py
