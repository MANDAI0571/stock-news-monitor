{"name": "apply_fix19", "on": {"workflow_dispatch": {}}, "jobs": {"apply": {"runs-on": "ubuntu-latest", "permissions": {"contents": "read", "actions": "read"}, "steps": [{"uses": "actions/checkout@v7"}, {"uses": "actions/setup-python@v6", "with": {"python-version": "3.11"}}, {"name": "deps", "run": "pip install -r requirements.txt"}, {"name": "fetch", "env": {"GH_TOKEN": "${{ github.token }}"}, "run": "rm -rf outputs .na && mkdir -p outputs .na && a=$(gh run list --workflow daily-discipline.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId') && gh run download \"$a\" -n stock-news-monitor-outputs -D outputs || true; b=$(gh run list --workflow note_draft_cloud.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId') && gh run download \"$b\" -n note-draft-cloud -D .na || true; cp -a .na/. outputs/ 2>/dev/null || true; rm -rf .na; ls outputs | head -60; wc -c outputs/note_highs*.md outputs/note_pullback*.md 2>/dev/null || true"}, {"name": "send", "env": {"GMAIL_USER": "${{ secrets.GMAIL_USER }}", "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}", "MAIL_TO": "${{ secrets.MAIL_TO }}"}, "run": "python3 cloud_mail_digest.py --output-dir outputs --force-send"}, {"name": "notify", if: failure(), "env": {"GMAIL_USER": "${{ secrets.GMAIL_USER }}", "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}", "MAIL_TO": "${{ secrets.MAIL_TO }}"}, "run": "python3 notify_workflow_failure.py"}]}}}
