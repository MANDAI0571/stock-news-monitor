name: 米株（毎日）

on:
  workflow_dispatch:
  schedule:
    # 米国市場が閉まるのは日本時間の朝5〜6時。そのあとに動かす。
    # cron は UTC。UTC 22:00(月〜金) = JST 翌朝07:00(火〜土)。
    - cron: "0 22 * * 1-5"
    # GitHub側で起動が遅れることがあるので予備を2本。
    # 先に走った回が公開ずみなら run_us_daily.py が自分で止まる（二重送信しない）。
    - cron: "0 23 * * 1-5"
    - cron: "0 0 * * 2-6"
  # このファイルを変えたときも動かす。その日の印にメールを送った行が無ければ、記事とメールだけを
  # やり直す（約定と宣告はしない）。送り済みなら run_us_daily.py が自分で止まる（2026-10-20）。
  push:
    paths:
      - ".github/workflows/us_screening_check.yml"

concurrency:
  group: us-daily
  cancel-in-progress: false

permissions:
  # コピー用ページ（docs/copy/us_*.html）と米株の台帳を main に push するため。
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # note の見出し画像の日本語の字体（IPAex ゴシック）。matplotlib は要らないので --no-deps（2026-10-22）
          pip install "pillow>=10,<12" >/dev/null && pip install --no-deps "japanize-matplotlib==1.1.3" >/dev/null || echo "::warning title=note 画像::字体を入れられませんでした（タグだけ送ります）"

      - name: Run US daily
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 3本目の cron（日本時間 9:00 予定。実際は 12 時ごろ）が最後の回。前営業日の日足がまだ無ければ、
          # それより前の回は失敗にせず次の回に回し、最後の回だけ失敗にする（2026-10-22）
          US_LAST_TRY: ${{ github.event.schedule == '0 0 * * 2-6' && '1' || '0' }}
        run: python3 run_us_daily.py

      - name: Show results
        if: always()
        run: |
          for f in outputs/note_us_*.md; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            head -n 12 "$f"
          done

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-daily
          path: |
            outputs/note_us_*.md
            outputs/screening_us_*.csv
          if-no-files-found: warn

      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py || true
