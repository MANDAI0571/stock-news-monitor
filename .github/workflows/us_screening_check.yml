name: 米株（毎日）

on:
  workflow_dispatch:
  schedule:
    # 米国市場が閉まるのは日本時間の朝5〜6時。そのあとに動かす。
    # cron は UTC。UTC 22:00(月〜金) = JST 翌朝07:00(火〜土)。
    - cron: "0 22 * * 1-5"
    # GitHub側で起動が遅れることがあるので予備を2本。
    # 先に走った回が公開ずみなら run_us_daily.py が自分で止まる（二重送信しない）。
    - cron: "0 23 * * 1-5"
    - cron: "0 0 * * 2-6"

concurrency:
  group: us-daily
  cancel-in-progress: false

permissions:
  # コピー用ページ（docs/copy/us_*.html）と米株の台帳を main に push するため。
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US daily
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 run_us_daily.py

      - name: Show results
        if: always()
        run: |
          for f in outputs/note_us_*.md; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            head -n 12 "$f"
          done

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-daily
          path: |
            outputs/note_us_*.md
            outputs/screening_us_*.csv
          if-no-files-found: warn

      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py || true
