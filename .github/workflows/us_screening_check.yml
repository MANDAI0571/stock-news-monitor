name: US Screening Check (米株スクリーナーの動作確認)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "動作確認する銘柄数（空なら全519銘柄）"
        type: string
        default: "30"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1 price check
        run: |
          python3 -c "
          from scanner.prices import fetch_price_history
          ok = 0
          for t in ('AAPL', 'MSFT', 'BRK-B'):
              df = fetch_price_history(t)
              n = 0 if df is None or df.empty else len(df)
              last = '' if n == 0 else str(df.index[-1].date())
              px = '' if n == 0 else round(float(df['Close'].iloc[-1]), 2)
              print(t, 'rows=', n, 'last=', last, 'close=', px)
              if n > 200: ok += 1
          print('price_ok=', ok, '/3')
          raise SystemExit(0 if ok else 1)
          "

      - name: 2 universe check
        run: |
          python3 -c "
          from scanner.universe_us import load_us_universe, UsUniverseConfig
          df = load_us_universe(UsUniverseConfig(nasdaq_top=100))
          print('universe=', len(df))
          print(df['market'].value_counts().to_string())
          raise SystemExit(0 if len(df) >= 400 else 1)
          "

      - name: 3 run screener
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$LIMIT" ]; then
            python3 run_screening_us.py --limit "$LIMIT"
          else
            python3 run_screening_us.py
          fi

      - name: 4 show results
        if: always()
        run: |
          for f in outputs/screening_us_*.csv; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            head -n 6 "$f"
          done

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-screening-check
          path: outputs/screening_us_*.csv
          if-no-files-found: warn
