name: 米株（毎日）

on:
  workflow_dispatch:
  schedule:
    # 米国市場が閉まるのは日本時間の朝5〜6時。そのあとに動かす。cron は UTC（UTC 0:17 = JST 9:17）。
    # 先に走った回が公開ずみなら run_us_daily.py が自分で止まる（二重送信しない）。
    # 2026-10-23: GitHub から取る前営業日の日足は、朝いちばんと2本目（9:25・10:21 着）ではまだ無かった
    # （同じ時刻に Mac からは取れた）。
    # 2026-10-27: 毎時ちょうど（:00）の予約は GitHub が混む時刻で、起動されないことがある（GitHub の説明書きに
    # ある）。10/23 に足した JST 7:00・8:00 の回は一度も起動されず、10/27 は 9:00 の回も起動されなかった。
    # 10:13 の回は日足がまだで、10:56 の回でそろった。そこで :00 を避け、10時台を厚く、最後を 12:17 にする。
    - cron: "17 0 * * 2-6"
    - cron: "17 1 * * 2-6"
    - cron: "47 1 * * 2-6"
    - cron: "17 2 * * 2-6"
    - cron: "17 3 * * 2-6"
  # このファイルを変えたときも動かす。その日の印にメールを送った行が無ければ、記事とメールだけを
  # やり直す（約定と宣告はしない）。送り済みなら run_us_daily.py が自分で止まる（2026-10-20）。
  push:
    paths:
      - ".github/workflows/us_screening_check.yml"

concurrency:
  group: us-daily
  cancel-in-progress: false

permissions:
  # コピー用ページ（docs/copy/us_*.html）と米株の台帳を main に push するため。
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # note の見出し画像の日本語の字体（IPAex ゴシック）。matplotlib は要らないので --no-deps（2026-10-22）
          pip install "pillow>=10,<12" >/dev/null && pip install --no-deps "japanize-matplotlib==1.1.3" >/dev/null || echo "::warning title=note 画像::字体を入れられませんでした（タグだけ送ります）"

      - name: Restore ICT track
        # 押し目の箱で記事に出した銘柄のその後の記録（ict_track.py、2026-10-25）。銘柄が入るのでコミットせずキャッシュに置く
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: us_track
          key: us-track-none-${{ github.run_id }}
          restore-keys: us-track-

      - name: Run US daily
        id: run
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 5本目の cron（日本時間 11:00 予定。実際はもっと遅れる）が最後の回。前営業日の日足がまだ無ければ、
          # それより前の回は失敗にせず次の回に回し、最後の回だけ失敗にする（2026-10-22。10-23 に5本目へ）
          US_LAST_TRY: ${{ github.event.schedule == '17 3 * * 2-6' && '1' || '0' }}
        run: |
          rm -f us_track/.changed
          python3 run_us_daily.py

      - name: Keep ICT track
        # 記録を書き換えた回（us_track/.changed がある）だけ残す。push（確認）の回は残さない
        if: github.event_name != 'push' && steps.run.outcome == 'success' && hashFiles('us_track/.changed') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: us_track
          key: us-track-${{ github.run_id }}

      - name: Show results
        if: always()
        run: |
          for f in outputs/note_us_*.md; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            head -n 12 "$f"
          done

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-daily
          path: |
            outputs/note_us_*.md
            outputs/screening_us_*.csv
          if-no-files-found: warn

      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py || true
