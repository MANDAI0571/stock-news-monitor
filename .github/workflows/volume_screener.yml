name: Volume Screener

# 出来高急増×下降トレンドのスクリーナー（東証プライム約1,556銘柄）を GitHub で動かす。
# 【2026-10-12 追加】もとは持ち主の Mac の定期タスク（14:10）で動かしていたが、
#   ・Mac がスリープしていると動かない
#   ・Claude の使用量の上限に当たると、失敗の知らせも出ずに止まる（2026-10-05 の実例）
# ため、こちらへ移す。中身は volume_screener/（Mac の stock-volume-screener/screener の写し）。
#
# 起こし方: 中継（intraday_relay）が立会日の 14:05 に repository_dispatch で起こす。
#   cron は数時間遅れて届くので予備だけ（今日の記録があれば何もしない）。
# 2026-10-16 から本番はこちらだけ（Mac の定期タスクは停止）。VS_SEND が "1" でなければ送らない。
# push で動いたとき（このファイルを変えたとき）は、前営業日の再現（--asof）で動作だけ確かめる。
# このリポジトリは公開なので、結果（銘柄）はコミットも成果物（artifact）にもしない。記録
# （out/history・out/track.json）は外から見えない Actions のキャッシュに置き、画面に出す注記は
# 状態と件数だけにする。

on:
  repository_dispatch:
    types: [volume_screener]
  schedule:
    - cron: "20 5 * * 1-5"   # 14:20 JST（予備。遅れて届く）
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/volume_screener.yml"

concurrency:
  group: volume-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SCREENER_OUT: volume_screener/out
      VS_SEND: "1"
      # 2026-10-16: 持ち主「出来高急増メールはGitHubだけでいい」。試験の印を外し、Mac の定期タスクは止めた。
      VS_TAG: ""
      # 株探は GitHub から届かない（HTTP 405、2026-10-13 に確認）。業績は取らずに「出していません」と書く。
      VS_NO_FUNDAMENTALS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "openpyxl>=3.1,<4" "pandas>=2.2,<3.0" "jpholiday>=1.0,<2" >/dev/null
          # note の見出し画像の日本語の字体（IPAex ゴシック）。matplotlib は要らないので --no-deps（2026-10-22）
          pip install "pillow>=10,<12" >/dev/null && pip install --no-deps "japanize-matplotlib==1.1.3" >/dev/null || echo "::warning title=note 画像::字体を入れられませんでした（タグだけ送ります）"

      - name: Restore cache and history
        uses: actions/cache@v4
        with:
          path: |
            volume_screener/cache
            volume_screener/out/history
            volume_screener/out/track.json
          key: volume-screener-${{ github.run_id }}
          restore-keys: volume-screener-

      - name: Restore sector strength (previous business day)
        # ランク（◎＝業種の勢いがとても弱い）に使う全市場の業種の勢い。前営業日の引け後に
        # note_daily_drafts.yml が残した最新のものを使う。前営業日のものでなければ rank.py が付けない。
        uses: actions/cache/restore@v4
        with:
          path: sector_strength
          key: sector-strength-none-${{ github.run_id }}
          restore-keys: sector-strength-

      - name: Guard (already ran today)
        id: guard
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          hm=$((10#$(TZ=Asia/Tokyo date +%H%M)))
          # 今日の記録が「予定の時間帯に取ったもの」かどうか（予定より前の手動の回で止めないため）
          done_ok=$(python3 -c "import json,sys; d=json.load(open('volume_screener/out/history/${today}.json')); print('yes' if d.get('within_window', True) else 'no')" 2>/dev/null || echo "none")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "mode=asof" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$hm" -lt 1420 ] || [ "$done_ok" = "yes" ]; }; then
            # 予備の cron は 14:20 より前に届いても動かさない（夜中に前日分が届くと失敗メールになり、
            # 午前に届くと途中の出来高で今日の記録を作って 14:05 の本番を止めていた。2026-10-19 の見直し）
            echo "volume_screener: 予備の定期実行は動かさない（${hm} / 今日の記録 ${done_ok}）"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          elif [ "$done_ok" = "yes" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "volume_screener: ${today} は実行済み（何もしない）"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe kabutan
        # 2026-10-13 の初回は業績が3件とも取れなかった。株探が GitHub から届くかを応答の番号だけで見る。
        continue-on-error: true
        run: |
          code=$(curl -sS -L -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" --max-time 20 "https://kabutan.jp/stock/finance?code=7203" 2>&1 || true)
          echo "::notice title=volume_screener kabutan::http=${code}"

      - name: Run screener
        if: steps.guard.outputs.mode == 'live'
        run: |
          mkdir -p volume_screener/out
          # 公開リポジトリの実行ログに銘柄が出ないよう、出力はファイルにだけ残す（失敗メールに末尾を使う）
          python3 volume_screener/daily_run.py > volume_screener/out/stdout.log 2> volume_screener/out/stderr.log || true
          echo "::notice title=volume_screener status::$(cat volume_screener/out/status.txt 2>/dev/null || echo MISSING)"

      - name: Send (or dry run)
        if: steps.guard.outputs.mode == 'live'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 volume_screener/send.py

      - name: Note article (paid) by mail
        # 失敗しても、出来高急増のメールは送り済み。ジョブを失敗にすると今日の記録がキャッシュに残らず、
        # 予備の cron がもう一度メールを送っていた（2026-10-19 の見直し）
        continue-on-error: true
        # 2026-10-16 持ち主「出来高急増メールを有料化してnoteに出したい」。同じ結果から note の
        # 有料記事（前半は無料、「▼ここから有料▼」より下が銘柄の一覧）を作り、貼り付け用のメールで届ける
        # （2026-10-18: note は reCAPTCHA で自動ログインできないため）。値段の設定と公開は持ち主が行う。
        # 送らない日（休場・失敗）は作らない。
        if: steps.guard.outputs.mode == 'live'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 volume_screener/note_article.py --out outputs/vs_note
          if [ ! -f outputs/vs_note/note_drafts_manifest.json ]; then exit 0; fi
          python3 note_mail.py --dir outputs/vs_note --subject "【note貼り付け用】$(TZ=Asia/Tokyo date +%F) 出来高急増×下降（有料記事）"

      - name: Check run (previous business day, no mail)
        if: steps.guard.outputs.mode == 'asof'
        run: |
          day=$(python3 -c "import sys; sys.path.insert(0, 'volume_screener'); import fetchlib as F, datetime as dt; d = dt.date.today() - dt.timedelta(days=1)
          while not F.is_business_day(d)[0]: d -= dt.timedelta(days=1)
          print(d)")
          # SCREENER_OUT があると --asof もそこに書くので外す（out_asof に書かせる）
          env -u SCREENER_OUT python3 volume_screener/daily_run.py --asof "$day" > /dev/null 2> asof_stderr.log || true
          tail -5 asof_stderr.log | grep -v "split_adjusted" || true
          python3 -c "import json; d = json.load(open('volume_screener/out_asof/result.json')); e = d['errors']; print('::notice title=volume_screener asof ${day}::rows=%d ' % len(d['rows']) + json.dumps({k: e.get(k) for k in ('universe', 'no_bar', 'daily', 'implausible', 'stage_b', 'fund', 'fund_stale')}))" || echo "::warning title=volume_screener asof ${day}::result.json なし"


      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py
