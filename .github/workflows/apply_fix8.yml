{"name":"Apply Fix 8","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","timeout-minutes":20,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"deps","run":"pip install -r requirements.txt"},{"name":"apply","run":"cat .fix8/p*.txt | tr -d '\\n' > /tmp/fix8.b64\nbase64 -d /tmp/fix8.b64 | gunzip > /tmp/fix8.patch\necho \"2da182d472cb0359fe275ea93b235e19594fb9cfb83a277bd9b92490b1e19659  /tmp/fix8.patch\" | sha256sum -c -\ngit apply --check /tmp/fix8.patch\ngit apply /tmp/fix8.patch\npython3 -m py_compile intraday_high_alert.py self_test.py\npython3 - <<'PY2'\nimport sys; sys.path.insert(0,'.')\nimport self_test as t\nt._test_intraday_mail_time_is_jst()\nt._test_intraday_mail_is_capped()\nt._test_intraday_summary_counts_today_only()\nt._test_every_workflow_notifies_on_failure()\nPY2\nrm -rf .fix8\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"fix(intraday): print alert mail timestamps in JST (runner is UTC)\"\ngit push"},{"name":"failure mail (if: failure())","if":"failure()","env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 notify_workflow_failure.py"}]}}}
