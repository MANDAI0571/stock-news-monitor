{"name":"Apply Fix","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4"},{"name":"apply","run":"set -euo pipefail\ncat > /tmp/fix.b64 <<'B64'\\nB64\nbase64 -d /tmp/fix.b64 | gunzip > /tmp/fix.patch\ngot=$(sha256sum /tmp/fix.patch | cut -d' ' -f1)\necho \"PATCH_SHA got=$got want=30b3aec1f8e4f75ff3666c3ed70b1212332e629676977a9a4bc627acf22e182c\"\nif [ \"$got\" != \"30b3aec1f8e4f75ff3666c3ed70b1212332e629676977a9a4bc627acf22e182c\" ]; then echo \"PATCH_CORRUPT\"; exit 1; fi\ngit apply --check -v /tmp/fix.patch\ngit apply /tmp/fix.patch\npython -m py_compile scanner/prices.py intraday_high_alert.py\necho \"PY_COMPILE_OK\"\ngit --no-pager diff --stat\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add scanner/prices.py intraday_high_alert.py\ngit commit -m \"fix(prices): drain queue before join to stop batch prefetch deadlock\"\ngit push\ngit --no-pager log --oneline -1\necho \"APPLY_FIX_DONE\"\n"}]}}}
