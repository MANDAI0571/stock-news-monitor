{"name":"Apply Fix 6","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","timeout-minutes":20,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"deps","run":"pip install -r requirements.txt"},{"name":"apply","run":"cat .fix6/p*.txt | tr -d '\\n' > /tmp/fix6.b64\nbase64 -d /tmp/fix6.b64 | gunzip > /tmp/fix6.patch\necho \"299daf7c829a33b5740d01547a4a818c4bed1a99faa0d7dbdb2dcd6fcfb5eeba  /tmp/fix6.patch\" | sha256sum -c -\ngit apply --check /tmp/fix6.patch\ngit apply /tmp/fix6.patch\npython3 -m py_compile note_draft.py validate_note_artifact.py self_test.py\npython3 - <<'PY'\nimport sys; sys.path.insert(0,'.')\nimport self_test as t\nt._test_claude_note_holdings_come_from_ledger()\nt._test_claude_note_structure_is_readable()\nt._test_note_artifact_validator_contract()\nt._test_every_workflow_notifies_on_failure()\nPY\nrm -rf .fix6\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"fix(note): 300man holdings from ledger, split today candidates, restructure article\"\ngit push"},{"name":"failure mail (if: failure())","if":"failure()","env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 notify_workflow_failure.py"}]}}}
