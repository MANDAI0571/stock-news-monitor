name: Intraday High Alert

# ザラ場中の「52週高値更新（一時更新含む）」と「直近高値ブレイク」をGmail通知するリアルタイムアラート。
# note下書き、300万円運用のメール通知はしない。日次note処理とは完全に独立。
#
# 【2026-07-27 修正の理由】
# 同日12:05〜12:26の変更で「15分ごとのcronで1回スキャンする」方式に変わったが、
# 変更後、スケジュール実行が一度も発火していない（最後のschedule実行は #109）。
# 原因として濃厚なのは次の2点。
#   (1) cronの分指定を 0/15/30/45 に置いた。GitHub Actions の schedule は毎時の
#       キリのよい分に負荷が集中し、遅延・欠落が起きやすい。変更前のファイルには
#       「毎時00分付近の混雑を避ける」と明記され、09:07 と 12:37 に設定されていた。
#   (2) 全銘柄スキャンの所要が約22分あり、15分間隔では原理的に間に合わない。
# そこで、実績のある「場の開始時に1回起動し、ジョブ内で引けまで巡回する」方式に戻す。
#
# 実行: 日本時間(JST)の前場・後場の開始時に起動し、ジョブ内で繰り返しスキャン。
#   前場 09:00〜11:30 JST  /  後場 12:30〜15:30 JST
# GitHub Actions の cron は UTC。JST = UTC + 9h なので 9時間引く。
#   09:07 JST → 00:07 UTC  /  12:37 JST → 03:37 UTC
# JSTの平日(月〜金)は、対応するUTC時刻でも同じ曜日(月〜金=1-5)になる。土日は実行しない。

on:
  # 手動の「起こし直し」用。空コミットでこのファイルを触ると即起動する。
  push:
    paths:
      - ".github/triggers/intraday-high-alert"
  workflow_dispatch:
    inputs:
      quick_mode:
        description: "テスト用に先頭N銘柄だけ実行（手動確認用）"
        type: boolean
        default: true
      max_symbols:
        description: "QUICK_MODE時に処理する銘柄数"
        type: string
        default: "30"
  schedule:
    # 毎時00分付近の混雑を避ける。09:07 と 12:37 JST に起動する。
    # 保険として15分後・30分後にも起こす。GitHub側でスケジュールが落ちる事故に備える。branch_protection_rule: # 先行の回が生きていれば concurrency で待たされ、直後に場外判定で即終了する。
    # 先行の回が生きていれば concurrency で待たされ、直後に場外判定で即終了する。
    - cron: "7 0 * * 1-5"
    - cron: "22 0 * * 1-5"
    - cron: "37 0 * * 1-5"
    - cron: "37 3 * * 1-5"
    - cron: "52 3 * * 1-5"
    - cron: "7 4 * * 1-5"

# 同時実行を防ぐ（前の回が長引いたら次の回は待つ。キャンセルはしない）。
concurrency:
  group: intraday-high-alert
  cancel-in-progress: false

jobs:
  intraday-high-alert:
    runs-on: ubuntu-latest
    # 前場・後場を通しで見張るため長めに取る（実績値: 前場約2時間57分、後場約3時間2分）。
    timeout-minutes: 240
    # 前日EODのスクリーニング結果アーティファクトを読むため read 権限が要る。
    permissions:
      contents: read
      actions: read
    # 本番は常に全銘柄（約3,544銘柄）が母集団。
    # QUICK_MODE は手動実行(workflow_dispatch)のテスト時だけ有効。
    env:
      QUICK_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'false' || (github.event.inputs.quick_mode == 'false' && 'false' || 'true') }}
      MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '30' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 日本の祝日はザラ場が無いのでスキップ（可能な範囲・jpholiday）。
      # 取得失敗や未導入でも実行は止めない（最低限「平日のみ」は cron で担保済み）。
      - name: Skip Japanese holidays
        id: holiday
        run: |
          python -m pip install --upgrade pip >/dev/null 2>&1 || true
          pip install jpholiday >/dev/null 2>&1 || true
          python - <<'PY'
          import datetime, os
          skip = False
          try:
              import jpholiday
              # UTC実行時刻 + 9h = JSTの当日
              jst = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
              today = jst.date()
              if jpholiday.is_holiday(today):
                  skip = True
                  print(f"jp_holiday={jpholiday.is_holiday_name(today)} date={today} -> skip")
              else:
                  print(f"jp_holiday=none date={today} -> run")
          except Exception as exc:
              print(f"holiday_check_skipped={exc} (continue)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Install dependencies
        if: steps.holiday.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 同じジョブ内で巡回するため本来は不要だが、ジョブが落ちて再起動した場合に
      # 同日の重複メールを防ぐため、直前の成功実行のartifactを復元しておく。
      - name: Restore today's dedup state (best-effort)
        if: steps.holiday.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs
          run_id=$(gh run list --workflow intraday_high_alert.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$run_id" ]; then
            echo "restore dedup state from run_id=$run_id"
            gh run download "$run_id" -n intraday-high-alerts -D outputs 2>/dev/null || echo "no previous state artifact"
          else
            echo "no previous run -> fresh state"
          fi
          find outputs -name 'intraday_alert_state_*.json' 2>/dev/null || true

      - name: Run intraday high alert
        if: steps.holiday.outputs.skip != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # カブタン等の全銘柄ベースの一覧と一致させるため、ウォッチリストは使わず常に全銘柄を母集団にする。
          INTRADAY_USE_WATCHLIST: "0"
          # 流動性ゲートを1億円→5000万円に緩和（小型株の取り逃し対策）。
          IH_MIN_TURNOVER: "50000000"
          # メール通知は「すでに高値を更新・ブレイクした銘柄」だけに絞る。
          # 接近系を含めると1回あたり1,000件超になりメールが読めないため。
          # 値は break / 52w / all。詳細は intraday_high_alert.py の _alert_scope を参照。
          IH_ALERT_SCOPE: "break"
        run: |
          start=$(date +%s)
          scan=0
          while true; do
          hm0=$(TZ=Asia/Tokyo date +%H%M); n0=$((10#$hm0)); if { [ "$n0" -ge 900 ] && [ "$n0" -lt 1130 ]; } || { [ "$n0" -ge 1230 ] && [ "$n0" -lt 1530 ]; }; then :; elif [ "$scan" -eq 0 ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "[GUARD] outside market hours jst=$hm0 but manual run -> single scan"; else echo "[GUARD] outside market hours jst=$hm0 -> exit without scanning (scans=$scan)"; break; fi
            scan=$((scan+1))
            echo "[SESSION] scan #${scan} started jst=$(TZ=Asia/Tokyo date '+%H:%M:%S')"
            if [ "${QUICK_MODE}" = "true" ]; then
              python3 intraday_high_alert.py --limit "${MAX_SYMBOLS}" || echo "[SESSION] scan #${scan} failed (continue)"
            else
              python3 intraday_high_alert.py || echo "[SESSION] scan #${scan} failed (continue)"
            fi
            echo "[SESSION] scan #${scan} finished jst=$(TZ=Asia/Tokyo date '+%H:%M:%S')"
            hm=$(TZ=Asia/Tokyo date +%H%M)
            now=$((10#$hm))
            if { [ "$now" -ge 900 ] && [ "$now" -lt 1130 ]; } || \
               { [ "$now" -ge 1230 ] && [ "$now" -lt 1530 ]; }; then
              # 全銘柄スキャン自体に時間がかかるので、待ち時間は短めでよい。
              echo "[SESSION] next scan in 60s"
              sleep 60
            else
              echo "[SESSION] market session ended jst=$hm total_scans=${scan}"
              break
            fi
          done
          end=$(date +%s); echo "[TIMER] intraday_high_alert elapsed=$((end-start))s scans=${scan}"

      - name: Upload alert outputs
        if: steps.holiday.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: intraday-high-alerts
          path: |
            outputs/intraday_high_alerts_*.csv
            outputs/intraday_alert_state_*.json
          if-no-files-found: ignore
