name: Intraday High Alert

# ザラ場中の「52週高値更新（一時更新含む）」と「直近高値接近・到達」をGmail通知するリアルタイムアラート。
# note下書き、300万円運用のメール通知はしない。日次note処理とは完全に独立。
#
# 実行: 日本時間(JST)のザラ場中だけ、15分ごと。
#   前場 09:00〜11:30 JST  /  後場 12:30〜15:30 JST
# GitHub Actions の cron は UTC。JST = UTC + 9h なので 9時間引く:
#   09:00〜11:30 JST → 00:00〜02:30 UTC
#   12:30〜15:30 JST → 03:30〜06:30 UTC
# JSTの平日(月〜金)は、対応するUTC時刻でも同じ曜日(月〜金=1-5)になる
# （00:00 UTC = 当日09:00 JST のため日付がまたがらない）。土日は実行しない。
# 注: GitHub Actions の cron は分指定が単一値。15分刻みは */15 で表現する。

on:
  workflow_dispatch:
    inputs:
      quick_mode:
        description: "テスト用に先頭N銘柄だけ実行（手動確認用）"
        type: boolean
        default: true
      max_symbols:
        description: "QUICK_MODE時に処理する銘柄数"
        type: string
        default: "30"
  schedule:
    # 前場: 00:00〜02:30 UTC（= 09:00〜11:30 JST）平日のみ、15分ごと
    - cron: "0,15,30,45 0,1 * * 1-5"
    - cron: "0,15,30 2 * * 1-5"
    # 後場: 03:30〜06:30 UTC（= 12:30〜15:30 JST）平日のみ、15分ごと
    - cron: "30,45 3 * * 1-5"
    - cron: "0,15,30,45 4,5 * * 1-5"
    - cron: "0,15,30 6 * * 1-5"

# 同時実行を防ぐ（前の回が長引いたら次の回は待つ。キャンセルはしない）。
concurrency:
  group: intraday-high-alert
  cancel-in-progress: false

jobs:
  intraday-high-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 前日EODのスクリーニング結果アーティファクトを読むため read 権限が要る。
    permissions:
      contents: read
      actions: read
    # 本番は常に全銘柄（約3,500銘柄）が母集団。バッチ一括取得で数分に収まる。
    # QUICK_MODE は手動実行(workflow_dispatch)のテスト時だけ有効。
    env:
      QUICK_MODE: ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.quick_mode == 'false' && 'false' || 'true') }}
      MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '30' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 日本の祝日はザラ場が無いのでスキップ（可能な範囲・jpholiday）。
      # 取得失敗や未導入でも実行は止めない（最低限「平日のみ」は cron で担保済み）。
      - name: Skip Japanese holidays
        id: holiday
        run: |
          python -m pip install --upgrade pip >/dev/null 2>&1 || true
          pip install jpholiday >/dev/null 2>&1 || true
          python - <<'PY'
          import datetime, os
          skip = False
          try:
              import jpholiday
              # UTC実行時刻 + 9h = JSTの当日
              jst = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
              today = jst.date()
              if jpholiday.is_holiday(today):
                  skip = True
                  print(f"jp_holiday={jpholiday.is_holiday_name(today)} date={today} -> skip")
              else:
                  print(f"jp_holiday=none date={today} -> run")
          except Exception as exc:
              print(f"holiday_check_skipped={exc} (continue)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Install dependencies
        if: steps.holiday.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 15分ごとの実行はVMが毎回まっさらなので、直前の実行が保存した「本日通知済みリスト」
      # （intraday_alert_state_YYYYMMDD.json）を取得して重複メールを防ぐ。無ければそのまま進む。
      - name: Restore today's dedup state (best-effort)
        if: steps.holiday.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs
          run_id=$(gh run list --workflow intraday_high_alert.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$run_id" ]; then
            echo "restore dedup state from run_id=$run_id"
            gh run download "$run_id" -n intraday-high-alerts -D outputs 2>/dev/null || echo "no previous state artifact"
          else
            echo "no previous run -> fresh state"
          fi
          find outputs -name 'intraday_alert_state_*.json' 2>/dev/null || true

      - name: Run intraday high alert
        if: steps.holiday.outputs.skip != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # カブタン等の全銘柄ベースの一覧と一致させるため、ウォッチリストは使わず常に全銘柄を母集団にする。
          INTRADAY_USE_WATCHLIST: "0"
          # 流動性ゲートを1億円→5000万円に緩和（カブタン/みんかぶ一覧に載る小型株の取り逃し対策）。
          IH_MIN_TURNOVER: "50000000"
        run: |
          start=$(date +%s)
          if [ "${QUICK_MODE}" = "true" ]; then
            python3 intraday_high_alert.py --limit "${MAX_SYMBOLS}"
          else
            python3 intraday_high_alert.py
          fi
          end=$(date +%s); echo "[TIMER] intraday_high_alert elapsed=$((end-start))s"

      - name: Upload alert outputs
        if: steps.holiday.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: intraday-high-alerts
          path: |
            outputs/intraday_high_alerts_*.csv
            outputs/intraday_alert_state_*.json
          if-no-files-found: ignore
