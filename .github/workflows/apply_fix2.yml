{"name":"Apply Fix 2","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4"},{"name":"apply","run":"set -euo pipefail\ncat > /tmp/fix.b64 <<'B64'\\nB64\nbase64 -d /tmp/fix.b64 | gunzip > /tmp/fix.patch\ngot=$(sha256sum /tmp/fix.patch | cut -d' ' -f1)\necho \"PATCH_SHA got=$got want=685a137e7ac3347cc168cbe6863e5214410868bda5a4683187d857e3d0437559\"\nif [ \"$got\" != \"685a137e7ac3347cc168cbe6863e5214410868bda5a4683187d857e3d0437559\" ]; then echo \"PATCH_CORRUPT\"; exit 1; fi\ngit apply --check -v /tmp/fix.patch\ngit apply /tmp/fix.patch\npython -m py_compile scanner/prices.py self_test.py\necho \"PY_COMPILE_OK\"\ngit --no-pager diff --stat\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add scanner/prices.py self_test.py\ngit commit -m \"fix(prices): retry rate-limited tickers and stop per-symbol stall\"\ngit push\ngit --no-pager log --oneline -1\necho \"APPLY_FIX_DONE\"\n"}]}}}
