{"name":"Apply Fix 7","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","timeout-minutes":20,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"deps","run":"pip install -r requirements.txt"},{"name":"apply","run":"cat .fix7/p*.txt | tr -d '\n' > /tmp/fix7.b64\nbase64 -d /tmp/fix7.b64 | gunzip > /tmp/fix7.patch\necho \"a84ae8f9791880bc8df51c9b65170c5a5f249592b23cccc65baf657c0d4bdd4a  /tmp/fix7.patch\" | sha256sum -c -\ngit apply --check /tmp/fix7.patch\ngit apply /tmp/fix7.patch\npython3 -m py_compile intraday_high_alert.py self_test.py\npython3 - <<'PY2'\nimport sys; sys.path.insert(0,'.')\nimport self_test as t\nt._test_intraday_mail_is_capped()\nt._test_claude_note_holdings_come_from_ledger()\nt._test_claude_note_structure_is_readable()\nt._test_every_workflow_notifies_on_failure()\nPY2\nrm -rf .fix7\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"fix(intraday): cap alert mail body to top-N by turnover, keep true count and CSV pointer\"\ngit push"},{"name":"failure mail (if: failure())","if":"failure()","env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 notify_workflow_failure.py"}]}}}
