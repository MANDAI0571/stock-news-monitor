name: Claude 300man Close Declare

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "補完する判定日 (YYYY-MM-DD)。空欄は当日引け後のみ"
        required: false
        type: string
  schedule:
    # 毎平日18:45 JST（09:45 UTC）。当日終値の確定後に翌営業日の注文を宣告する。
    - cron: "45 9 * * 1-5"
    # GitHub cronの取りこぼし対策（20:05 JST）。宣告は同一日・同一銘柄で冪等。
    - cron: "5 11 * * 1-5"

permissions:
  contents: write

# 翌朝のfillと手動実行が重なって注文台帳を同時更新しないよう、共通グループを使う。
concurrency:
  group: dual-ai-300man-ledger-write
  cancel-in-progress: false

jobs:
  declare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore price and universe cache
        uses: actions/cache@v6
        with:
          path: cache
          key: stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check JPX business day and close window
        id: guard
        env:
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          from jpx_calendar import is_jpx_business_day

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          scheduled = os.environ.get("GITHUB_EVENT_NAME") == "schedule"
          requested = os.environ.get("INPUT_TARGET_DATE", "").strip()

          def next_business_day(day: date) -> date:
              cursor = day + timedelta(days=1)
              for _ in range(30):
                  if is_jpx_business_day(cursor):
                      return cursor
                  cursor += timedelta(days=1)
              raise RuntimeError(f"next business day not found after {day}")

          if requested:
              try:
                  target = date.fromisoformat(requested)
              except ValueError:
                  target = now.date()
                  run = False
                  reason = "invalid_target_date"
              else:
                  execution = next_business_day(target) if is_jpx_business_day(target) else target
                  market_closed = now.date() > target or (now.date() == target and now.hour >= 16)
                  before_execution = now.date() < execution or (now.date() == execution and now.hour < 9)
                  run = is_jpx_business_day(target) and market_closed and before_execution
                  reason = "manual_recovery" if run else "unsafe_manual_recovery"
          elif scheduled and now.hour < 8:
              # 18:45 JSTのcronがGitHub都合で深夜に遅延した場合だけ、前日分を補完する。
              target = (now - timedelta(days=1)).date()
              run = is_jpx_business_day(target)
              reason = "scheduled_delayed_recovery" if run else "jpx_closed"
          elif 16 <= now.hour and (scheduled or now.hour < 23):
              target = now.date()
              run = is_jpx_business_day(target)
              reason = "jpx_business_day" if run else "jpx_closed"
          else:
              target = now.date()
              run = False
              intended = (now - timedelta(days=1)).date() if now.hour < 16 else now.date()
              if scheduled and is_jpx_business_day(intended):
                  reason = f"declaration_lost_{intended:%Y%m%d}_ran_{now:%H%M}_JST"
              elif scheduled:
                  reason = "jpx_closed"
              else:
                  reason = f"outside_close_window_{now:%H%M}_JST"
          print(
              f"claude_300man_declare_guard run={run} reason={reason} "
              f"target={target} now={now:%F_%H%M}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if run else 'false'}\n")
              output.write(f"reason={reason}\n")
              output.write(f"date={target:%F}\n")
          PY

      - name: Fail when a declaration window was missed
        if: steps.guard.outputs.run != 'true' && steps.guard.outputs.reason != 'jpx_closed'
        run: |
          echo "::error::Claude 300man declaration skipped: ${{ steps.guard.outputs.reason }}"
          exit 1

      - name: Critical trading self-test
        if: steps.guard.outputs.run == 'true'
        run: python3 self_test_groups.py --group critical

      - name: Run fresh full-market screening
        if: steps.guard.outputs.run == 'true'
        run: python3 daily_discipline_run.py --include-rejected --max-candidates 0

      - name: Verify fresh screening target date
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import pandas as pd

          target = "${{ steps.guard.outputs.date }}"
          screening = pd.read_csv("outputs/screening_result.csv", dtype=str).fillna("")
          dates = sorted({value[:10] for value in screening.get("data_date", []) if value})
          print(f"claude_300man_screening_dates target={target} dates={dates}")
          if not dates or dates[-1] != target:
              raise SystemExit(f"screening date mismatch: target={target} dates={dates}")
          PY

      - name: Verify execution window is still open
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          from datetime import date, datetime, time, timedelta
          from zoneinfo import ZoneInfo

          from jpx_calendar import is_jpx_business_day

          target = date.fromisoformat("${{ steps.guard.outputs.date }}")
          execution = target + timedelta(days=1)
          for _ in range(30):
              if is_jpx_business_day(execution):
                  break
              execution += timedelta(days=1)
          else:
              raise SystemExit(f"execution day not found after {target}")
          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          deadline = datetime.combine(execution, time(9, 0), ZoneInfo("Asia/Tokyo"))
          print(f"claude_300man_execution_window now={now.isoformat()} deadline={deadline.isoformat()}")
          if now >= deadline:
              raise SystemExit(
                  f"execution window already opened: target={target} execution={execution}"
              )
          PY

      - name: Reconcile Claude paper ledgers before declaration
        if: steps.guard.outputs.run == 'true'
        id: reconcile
        run: |
          python3 claude_300man_reconcile.py \
            --date "${{ steps.guard.outputs.date }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Declare Claude orders for next JPX business day
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ "${{ steps.reconcile.outputs.allow_new_buys }}" = "true" ]; then
            python3 claude_300man_declare.py --date "${{ steps.guard.outputs.date }}"
          else
            echo "::error::Ledger reconciliation failed; blocking only new BUY declarations"
            python3 claude_300man_declare.py \
              --date "${{ steps.guard.outputs.date }}" \
              --block-new-buys
          fi

      - name: Update free Claude entry shadow
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 claude_300man_entry_shadow.py \
            --date "${{ steps.guard.outputs.date }}" \
            --screening outputs/screening_result.csv

      - name: Update free Claude shadow exits
        if: steps.guard.outputs.run == 'true'
        run: python3 claude_300man_shadow.py --date "${{ steps.guard.outputs.date }}"

      - name: Update Claude daily monitoring report
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 claude_300man_reconcile.py --date "${{ steps.guard.outputs.date }}"
          python3 claude_300man_daily_review.py --date "${{ steps.guard.outputs.date }}"

      - name: Show declaration summary
        if: always()
        run: |
          echo "=== Claude orders tail ==="
          tail -n 12 data/claude_300man_orders.csv || true
          echo "=== Fresh screening ==="
          ls -lh outputs/screening_result.csv outputs/screening_result_*.csv 2>/dev/null || true

      - name: Commit declaration ledger
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/claude_300man_orders.csv data/claude_300man_shadow.csv docs/claude_300man_shadow.md data/claude_300man_entry_shadow.csv docs/claude_300man_entry_shadow.md data/claude_300man_reconciliation.csv docs/claude_300man_reconciliation.md data/claude_300man_daily_monitor.csv data/claude_300man_improvement_candidates.csv docs/claude_300man_daily_monitor.md
          if git diff --cached --quiet; then
            echo "claude_300man_declare=no_order_change"
            exit 0
          fi
          git commit -m "chore: update Claude declaration and shadow ${{ steps.guard.outputs.date }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload declaration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-300man-close-declare
          path: |
            data/claude_300man_orders.csv
            data/claude_300man_shadow.csv
            docs/claude_300man_shadow.md
            data/claude_300man_entry_shadow.csv
            docs/claude_300man_entry_shadow.md
            data/claude_300man_reconciliation.csv
            docs/claude_300man_reconciliation.md
            outputs/screening_result.csv
            outputs/screening_result_*.csv
            outputs/s_rank_candidates_*.csv
          if-no-files-found: warn

      - name: Fail visibly on reconciliation findings
        if: steps.guard.outputs.run == 'true'
        run: python3 claude_300man_reconcile.py --date "${{ steps.guard.outputs.date }}" --fail-on-critical

      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py
