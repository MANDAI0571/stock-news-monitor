name: Claude 300man Close Declare

on:
  workflow_dispatch:
  schedule:
    # 毎平日18:45 JST（09:45 UTC）。当日終値の確定後に翌営業日の注文を宣告する。
    - cron: "45 9 * * 1-5"

permissions:
  contents: write

# 翌朝のfillと手動実行が重なって注文台帳を同時更新しないよう、共通グループを使う。
concurrency:
  group: dual-ai-300man-ledger-write
  cancel-in-progress: false

jobs:
  declare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore price and universe cache
        uses: actions/cache@v6
        with:
          path: cache
          key: stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check JPX business day and close window
        id: guard
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          from jpx_calendar import is_jpx_business_day

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          in_window = 16 <= now.hour < 23
          scheduled = os.environ.get("GITHUB_EVENT_NAME") == "schedule"
          if not in_window:
              intended = now.date() if now.hour >= 16 else (now - timedelta(days=1)).date()
              run = False
              if scheduled and is_jpx_business_day(intended):
                  reason = f"declaration_lost_{intended:%Y%m%d}_ran_{now:%H%M}_JST"
              elif scheduled:
                  reason = "jpx_closed"
              else:
                  reason = f"outside_close_window_{now:%H%M}_JST"
          else:
              run = is_jpx_business_day(now.date())
              reason = "jpx_business_day" if run else "jpx_closed"
          print(f"claude_300man_declare_guard run={run} reason={reason} date={now:%F}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if run else 'false'}\n")
              output.write(f"reason={reason}\n")
              output.write(f"date={now:%F}\n")
          PY

      - name: Fail when a declaration window was missed
        if: steps.guard.outputs.run != 'true' && steps.guard.outputs.reason != 'jpx_closed'
        run: |
          echo "::error::Claude 300man declaration skipped: ${{ steps.guard.outputs.reason }}"
          exit 1

      - name: Critical trading self-test
        if: steps.guard.outputs.run == 'true'
        run: python3 self_test_groups.py --group critical

      - name: Run fresh full-market screening
        if: steps.guard.outputs.run == 'true'
        run: python3 daily_discipline_run.py --include-rejected --max-candidates 0

      - name: Refuse a declaration after the target date moved
        if: steps.guard.outputs.run == 'true'
        run: |
          now=$(TZ=Asia/Tokyo date +%F)
          if [ "$now" != "${{ steps.guard.outputs.date }}" ]; then
            echo "::error::claude_300man_declare_date_moved target=${{ steps.guard.outputs.date }} now=$now"
            exit 1
          fi

      - name: Declare Claude orders for next JPX business day
        if: steps.guard.outputs.run == 'true'
        run: python3 claude_300man_declare.py --date "${{ steps.guard.outputs.date }}"

      - name: Show declaration summary
        if: always()
        run: |
          echo "=== Claude orders tail ==="
          tail -n 12 data/claude_300man_orders.csv || true
          echo "=== Fresh screening ==="
          ls -lh outputs/screening_result.csv outputs/screening_result_*.csv 2>/dev/null || true

      - name: Commit declaration ledger
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/claude_300man_orders.csv
          if git diff --cached --quiet; then
            echo "claude_300man_declare=no_order_change"
            exit 0
          fi
          git commit -m "chore: declare Claude 300man orders ${{ steps.guard.outputs.date }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload declaration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-300man-close-declare
          path: |
            data/claude_300man_orders.csv
            outputs/screening_result.csv
            outputs/screening_result_*.csv
            outputs/s_rank_candidates_*.csv
          if-no-files-found: warn

      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py
