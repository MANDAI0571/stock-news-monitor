{"name": "Apply Fix 9", "on": "workflow_dispatch", "permissions": {"contents": "write"}, "jobs": {"apply": {"runs-on": "ubuntu-latest", "timeout-minutes": 20, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}, {"name": "deps", "run": "pip install -r requirements.txt"}, {"name": "apply", "run": "cat .fix9/p*.txt | tr -d '\\n' > /tmp/fix9.b64\nbase64 -d /tmp/fix9.b64 | gunzip > /tmp/fix9.patch\necho \"21be56c93928e540a15a3f55b42ca557ed43aca14eb8282288428e038f379bd7  /tmp/fix9.patch\" | sha256sum -c -\ngit apply --check /tmp/fix9.patch\ngit apply /tmp/fix9.patch\npython3 -c \"import yaml; yaml.safe_load(open('.github/workflows/intraday_high_alert.yml'))\"\npython3 -m py_compile intraday_high_alert.py self_test.py\npython3 - <<'PY2'\nimport sys; sys.path.insert(0,'.')\nimport self_test as t\nt._test_intraday_morning_schedule_redundancy()\nt._test_intraday_mail_time_is_jst()\nt._test_intraday_mail_is_capped()\nt._test_intraday_summary_counts_today_only()\nt._test_every_workflow_notifies_on_failure()\nPY2\nrm -rf .fix9\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"fix(intraday): start before the open so dropped 00:xx UTC crons cannot kill morning alerts\"\ngit push"}, {"name": "failure mail (if: failure())", "if": "failure()", "env": {"GMAIL_USER": "${{ secrets.GMAIL_USER }}", "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}", "MAIL_TO": "${{ secrets.MAIL_TO }}"}, "run": "python3 notify_workflow_failure.py"}]}}}
