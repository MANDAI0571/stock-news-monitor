{"name": "apply_fix16", "on": {"workflow_dispatch": {}}, "jobs": {"apply": {"runs-on": "ubuntu-latest", "permissions": {"contents": "write"}, "steps": [{"uses": "actions/checkout@v7"}, {"uses": "actions/setup-python@v6", "with": {"python-version": "3.11"}}, {"name": "deps", "run": "pip install -r requirements.txt"}, {"name": "patch", "run": "cat tools/fix16a.b64 tools/fix16b.b64 tools/fix16c.b64 tools/fix16d.b64 | base64 -d | gunzip > tools/p16.py && python3 tools/p16.py && rm -f tools/p16.py && git rm -q tools/fix16a.b64 tools/fix16b.b64 tools/fix16c.b64 tools/fix16d.b64"}, {"name": "selftest", "run": "python3 self_test.py"}, {"name": "push", "run": "git config user.name github-actions && git config user.email actions@github.com && git add -A && git commit -m 'fix16: note draft one-click copy and note preview in mail' && git push"},{"name":"notify",if: failure(),"env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 notify_workflow_failure.py"}]}}}
