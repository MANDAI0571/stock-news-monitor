name: Codex 300man Close Declare

# Claude側（claude_300man_declare.yml）と対になる、Codex運用の宣告ジョブ。
# これが無い間、Codex運用は買った銘柄が売られないまま固定されていた
# （損切・利確・タイムアウト・新規建てがすべて止まる）。2026-10-02 に追加。
# 二つの運用を同条件で比べるため、Claude側と同じ構成・同じ時間帯にそろえている。

on:
  workflow_dispatch:
  schedule:
    # 毎平日18:50 JST（09:50 UTC）。当日終値の確定後に、翌営業日の注文を宣告する。
    # Claude側は18:45。台帳の同時書き込みを避けるため5分ずらしている。
    - cron: "50 9 * * 1-5"

permissions:
  contents: write

# Claude側の宣告・翌朝のfillと注文台帳を同時更新しないよう、共通グループを使う。
concurrency:
  group: dual-ai-300man-ledger-write
  cancel-in-progress: false

jobs:
  declare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore price and universe cache
        uses: actions/cache@v6
        with:
          path: cache
          key: stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check JPX business day and delayed schedule
        id: guard
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          from jpx_calendar import is_jpx_business_day

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          scheduled = os.environ.get("GITHUB_EVENT_NAME") == "schedule"
          in_window = 16 <= now.hour < 23
          # 遅れて動いた日は宣告しない。締切後に宣告しても翌朝09:40の約定に間に合わず、
          # 日付をまたぐと「翌営業日」の判定がまるごと1日ずれるため。
          if scheduled and not in_window:
              # 宣告すべきだった日は、0時を回っていれば前日。その日が営業日なら
              # 1日ぶんの宣告が失われているので、黙って成功にしない。
              # （now.date() だけで休場判定すると、金曜18:45ぶんが土曜0時台に
              #   押し出された場合に jpx_closed と誤判定して静かに消える。）
              intended = now.date() if now.hour >= 16 else (now - timedelta(days=1)).date()
              run = False
              reason = (f"declaration_lost_{intended:%Y%m%d}_ran_{now:%H%M}_JST"
                        if is_jpx_business_day(intended) else "jpx_closed")
          else:
              run = is_jpx_business_day(now.date())
              reason = "jpx_business_day" if run else "jpx_closed"
          print(f"codex_300man_declare_guard run={run} reason={reason} date={now:%F}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if run else 'false'}\n")
              output.write(f"reason={reason}\n")
              # 対象日をここで固定する。混雑待ちでジョブが日付をまたいでも、
              # 宣告スクリプトが別の日を見ないようにするため。
              output.write(f"date={now:%F}\n")
          PY

      - name: Fail loudly when the declaration was skipped by delay
        # 休場は静かに飛ばしてよい。だが遅延で宣告できなかった日を成功扱いにすると、
        # その日は損切・利確・タイムアウト・新規建てが全部止まったまま気づけない。
        if: steps.guard.outputs.run == 'false' && steps.guard.outputs.reason != 'jpx_closed'
        run: |
          echo "codex_300man_declare_skipped reason=${{ steps.guard.outputs.reason }}"
          exit 1

      - name: Critical trading self-test
        if: steps.guard.outputs.run == 'true'
        run: python3 self_test_groups.py --group critical

      - name: Run fresh full-market screening
        if: steps.guard.outputs.run == 'true'
        run: python3 daily_discipline_run.py --include-rejected --max-candidates 0

      - name: Fail loudly when the JST date moved while the job was running
        # 宣告スクリプトは実行時刻のJST日付から「翌営業日」を決める。順番待ちや
        # 全市場スクリーニングで0時をまたぐと、宣告先が丸ごと1日ずれる。
        # ずれたまま宣告するより、宣告せずに気づける方を選ぶ（翌朝09:40の約定には
        # どちらにしても間に合わないため）。
        if: steps.guard.outputs.run == 'true'
        run: |
          now=$(TZ=Asia/Tokyo date +%F)
          guard="${{ steps.guard.outputs.date }}"
          if [ "$now" != "$guard" ]; then
            echo "codex_300man_declare_date_moved guard=$guard now=$now"
            exit 1
          fi
          echo "codex_300man_declare_date_ok date=$now"

      - name: Declare Codex orders for next JPX business day
        if: steps.guard.outputs.run == 'true'
        run: python3 codex_300man_declare.py

      - name: Show declaration summary
        if: always()
        run: |
          echo "=== Codex orders tail ==="
          tail -n 12 data/codex_300man_orders.csv || true
          echo "=== Fresh screening ==="
          ls -lh outputs/screening_result.csv outputs/screening_result_*.csv 2>/dev/null || true

      - name: Commit declaration ledger
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codex_300man_orders.csv
          if git diff --cached --quiet; then
            echo "codex_300man_declare=no_order_change"
            exit 0
          fi
          git commit -m "chore: declare Codex 300man orders $(TZ=Asia/Tokyo date +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload declaration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-300man-close-declare
          path: |
            data/codex_300man_orders.csv
            outputs/screening_result.csv
            outputs/screening_result_*.csv
            outputs/s_rank_candidates_*.csv
          if-no-files-found: warn

      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py
