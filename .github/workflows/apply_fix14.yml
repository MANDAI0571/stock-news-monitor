{"name":"Apply Fix 14","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","timeout-minutes":30,"steps":[{"uses":"actions/checkout@v7"},{"uses":"actions/setup-python@v6","with":{"python-version":"3.11"}},{"name":"deps","run":"python -m pip install --upgrade pip && pip install -r requirements.txt"},{"name":"patch","run":"base64 -d tools/fix14.b64 | gunzip > tools/p14.py && python3 tools/p14.py && rm -f tools/p14.py && git rm -q tools/fix14.b64 && git --no-pager diff --stat HEAD"},{"name":"selftest-split","run":"python3 -c \"import sys;sys.path.insert(0,'.');import self_test;self_test._test_note_split_for_mobile()\""},{"name":"selftest-full","run":"python3 self_test.py"},{"name":"commit","run":"git config user.name 'github-actions[bot]' && git config user.email 'github-actions[bot]@users.noreply.github.com' && git add note_draft.py cloud_mail_digest.py note_autosave.py self_test.py && git commit -m 'fix: split heavy note drafts so they open on a phone' && git pull --rebase origin main && git push origin HEAD:main"},{"name":"notify","if":"failure()","env":{"GMAIL_USER":"${{ secrets.GMAIL_USER }}","GMAIL_APP_PASSWORD":"${{ secrets.GMAIL_APP_PASSWORD }}","MAIL_TO":"${{ secrets.MAIL_TO }}"},"run":"python3 notify_workflow_failure.py"}]}}}
