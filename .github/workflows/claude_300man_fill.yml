name: Dual AI 300man Open Fill

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "約定対象日 YYYY-MM-DD（空欄はJST当日）"
        required: false
        type: string
  schedule:
    - cron: "40 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dual-ai-300man-ledger-write
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Record Claude and Codex opening fills
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python3 claude_300man_fill.py --date "${{ github.event.inputs.target_date }}"
            python3 codex_300man_fill.py --date "${{ github.event.inputs.target_date }}"
          else
            python3 claude_300man_fill.py
            python3 codex_300man_fill.py
          fi
          python3 dual_300man_metrics.py
          python3 dual_300man_compare.py
          python3 claude_300man_shadow.py
          python3 claude_300man_reconcile.py
          python3 claude_300man_daily_review.py
      - name: Commit both independent ledgers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/claude_300man_orders.csv data/claude_300man_journal.csv docs/claude_300man_ledger.md data/codex_300man_orders.csv data/codex_300man_journal.csv docs/codex_300man_ledger.md docs/dual_300man_comparison.md docs/dual_300man_metrics.md data/claude_300man_shadow.csv docs/claude_300man_shadow.md data/claude_300man_reconciliation.csv docs/claude_300man_reconciliation.md data/claude_300man_daily_monitor.csv data/claude_300man_improvement_candidates.csv docs/claude_300man_daily_monitor.md
          git diff --cached --quiet && exit 0
          git commit -m "Update dual AI 300man journals [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Fail visibly on reconciliation findings
        run: python3 claude_300man_reconcile.py --fail-on-critical
      - name: Notify failure by mail
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify_workflow_failure.py
