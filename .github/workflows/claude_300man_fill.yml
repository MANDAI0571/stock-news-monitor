name: Claude 300man Open Fill

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "約定対象日 YYYY-MM-DD（空欄はJST当日）"
        required: false
        type: string
  schedule:
    - cron: "40 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: claude-300man-open-fill
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Record Claude opening fills
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python3 claude_300man_fill.py --date "${{ github.event.inputs.target_date }}"
          else
            python3 claude_300man_fill.py
          fi
      - name: Commit Claude-only ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/claude_300man_orders.csv data/claude_300man_journal.csv docs/claude_300man_ledger.md
          git diff --cached --quiet && exit 0
          git commit -m "Update Claude 300man journal [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
