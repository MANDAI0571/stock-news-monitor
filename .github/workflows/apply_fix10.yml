{"name": "Apply Fix 10", "on": "workflow_dispatch", "permissions": {"contents": "write"}, "jobs": {"apply": {"runs-on": "ubuntu-latest", "timeout-minutes": 20, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}, {"name": "deps", "run": "pip install -r requirements.txt"}, {"name": "apply", "run": "cat .fix10/p*.txt | tr -d '\\n' > /tmp/fix10.b64\nbase64 -d /tmp/fix10.b64 | gunzip > /tmp/fix10.patch\necho \"0264c9e27889df6b58c363e26b6ea7675cec15d2f001d7ebb4b17102342b5bd0  /tmp/fix10.patch\" | sha256sum -c -\ngit apply --check /tmp/fix10.patch\ngit apply /tmp/fix10.patch\npython3 -m py_compile self_test.py\npython3 - <<'PY2'\nimport sys; sys.path.insert(0,'.')\nimport self_test as t\nt._test_intraday_morning_schedule_redundancy()\nt._test_intraday_mail_time_is_jst()\nt._test_intraday_mail_is_capped()\nPY2\nrm -rf .fix10 .fix9\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m \"test(intraday): pin morning cron redundancy guard and drop fix chunks\"\ngit push"}]}}}
