{"name":"tmpapply","on":{"workflow_dispatch":{"inputs":{"b64":{"description":"gzip+base64 of fix script","required":true,"type":"string"}}}},"permissions":{"contents":"write"},"jobs":{"apply":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"apply","env":{"B64":"${{ inputs.b64 }}"},"run":"printf '%s' \"$B64\" | tr -d ' \\n' | base64 -d | gunzip > _tmp_fix.py; python3 _tmp_fix.py; rm -f _tmp_fix.py; git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'; git add -A; git commit -m 'apply tmp fix [skip ci]' || echo nochange; git push origin HEAD:main"},{"name":"notify",if: failure(),"env":{"GITHUB_TOKEN":"${{ github.token }}"},"run":"python3 notify_workflow_failure.py || true"}]}}}
